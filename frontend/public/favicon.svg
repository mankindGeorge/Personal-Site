<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFCC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B026FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#0D1117"/>
  <g stroke="url(#grad)" stroke-width="2" fill="none" filter="url(#glow)">
    <circle cx="50" cy="50" r="8" fill="#00FFCC"/>
    <circle cx="25" cy="30" r="5" fill="#B026FF"/>
    <circle cx="75" cy="30" r="5" fill="#B026FF"/>
    <circle cx="25" cy="70" r="5" fill="#B026FF"/>
    <circle cx="75" cy="70" r="5" fill="#B026FF"/>
    <line x1="50" y1="50" x2="25" y2="30"/>
    <line x1="50" y1="50" x2="75" y2="30"/>
    <line x1="50" y1="50" x2="25" y2="70"/>
    <line x1="50" y1="50" x2="75" y2="70"/>
    <circle cx="15" cy="50" r="3" fill="#00FFCC"/>
    <circle cx="85" cy="50" r="3" fill="#00FFCC"/>
    <line x1="25" y1="30" x2="15" y2="50"/>
    <line x1="75" y1="30" x2="85" y2="50"/>
  </g>
</svg>
